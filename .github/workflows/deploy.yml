name: Deploy to GitHub Pages

# main is published at the site root.
# Every other branch is published at /preview/<branch>/ and removed when the branch is deleted.

on:
  push:
    branches-ignore: [gh-pages]
  delete:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

env:
  SITE_BASE: /software-development-methodologies

jobs:
  deploy:
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target folder
        id: target
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "base=$SITE_BASE" >> "$GITHUB_OUTPUT"
          else
            slug=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g')
            echo "dir=preview/$slug" >> "$GITHUB_OUTPUT"
            echo "base=$SITE_BASE/preview/$slug" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          BASE_PATH: ${{ steps.target.outputs.base }}

      - name: Publish
        run: scripts/publish-pages.sh "${{ steps.target.outputs.dir }}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show URL
        run: echo "https://${GITHUB_REPOSITORY_OWNER}.github.io${{ steps.target.outputs.base }}/" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove preview
        run: |
          slug=$(echo "${{ github.event.ref }}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g')
          scripts/publish-pages.sh "preview/$slug"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
